apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletestapp-hpa-rps
  labels:
    app: scaletestapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "500m"  # 0.5 RPS на под - низкий порог для демонстрации
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # Быстрое масштабирование вверх
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300  # Медленное масштабирование вниз
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
